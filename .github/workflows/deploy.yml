name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure .nojekyll exists
        run: |
          echo "Creating .nojekyll file to disable Jekyll processing"
          touch ./dist/.nojekyll
          ls -la ./dist/.nojekyll || echo "Warning: .nojekyll file not created"

      - name: Verify deployment files
        run: |
          echo "Files in dist directory:"
          ls -la ./dist/ | head -20
          echo "Checking for .nojekyll:"
          test -f ./dist/.nojekyll && echo "✓ .nojekyll exists" || echo "✗ .nojekyll missing"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: https://www.vonreichardt.com
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
